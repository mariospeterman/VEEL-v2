openapi: 3.1.0
info:
  title: WeVid API
  version: 0.1.0
  description: >
    Contract-first API source of truth for the WeVid platform. Fastify routes,
    generated clients, tests, and docs must stay aligned with this file.
servers:
  - url: https://api.veel.example
    description: Production
  - url: http://localhost:4000
    description: Local
security:
  - appSessionCookie: []
tags:
  - name: Health
  - name: Auth
  - name: Age
  - name: Wallets
  - name: Profiles
  - name: Content
  - name: Performers
  - name: Managed Creators
  - name: Discover
  - name: Feed
  - name: Media
  - name: Live
  - name: Engagement
  - name: Messages
  - name: Payments
  - name: Referrals
  - name: Subscriptions
  - name: Events
  - name: Access Passes
  - name: Mutuals
  - name: Activity
  - name: AI
  - name: MCP
  - name: Admin
  - name: Webhooks
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      summary: API liveness probe
      responses:
        "200": { $ref: "#/components/responses/HealthStatus" }
  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      security: []
      summary: API deploy readiness probe
      responses:
        "200": { $ref: "#/components/responses/HealthStatus" }
        "503": { $ref: "#/components/responses/HealthStatus" }
  /v1/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Current session and protected-app gate state
      responses:
        "200": { $ref: "#/components/responses/SessionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/wallet/challenges:
    post:
      operationId: createWalletAuthChallenge
      tags: [Auth]
      security: []
      summary: Create a wallet-first login challenge
      x-idempotency-policy: single-use-auth-proof
      requestBody:
        $ref: "#/components/requestBodies/CreateWalletAuthChallenge"
      responses:
        "201": { $ref: "#/components/responses/WalletAuthChallenge" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/auth/wallet/sessions:
    post:
      operationId: createWalletAuthSession
      tags: [Auth]
      security: []
      summary: Verify a wallet challenge and create a WeVid session
      x-idempotency-policy: single-use-auth-proof
      requestBody:
        $ref: "#/components/requestBodies/CreateWalletAuthSession"
      responses:
        "201": { $ref: "#/components/responses/WalletAuthSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/auth/wallet/logout:
    post:
      operationId: revokeWalletAuthSession
      tags: [Auth]
      summary: Revoke the current HttpOnly wallet session
      x-idempotency-policy: single-use-auth-proof
      responses:
        "204": { description: Wallet session revoked }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/auth/sessions/logout-all:
    post:
      operationId: revokeAllApplicationSessions
      tags: [Auth]
      summary: Revoke every application session after recent authentication
      x-idempotency-policy: idempotent-state-transition
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "204": { description: All application sessions revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/auth/recovery/link-intents:
    post:
      operationId: createRecoveryLinkIntent
      tags: [Auth]
      summary: Create a short-lived recovery-link intent for the current recent application session
      x-idempotency-policy: single-use-auth-proof
      responses:
        "201": { $ref: "#/components/responses/ApplicationSessionExpiry" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/auth/recovery/exchange:
    post:
      operationId: exchangeRecoveryIdentity
      tags: [Auth]
      security:
        - recoveryBearer: []
      summary: Exchange an explicit Supabase recovery credential for a rotated WeVid application session
      x-idempotency-policy: single-use-auth-proof
      responses:
        "200": { $ref: "#/components/responses/ApplicationSessionExpiry" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/auth/recovery/unlink:
    post:
      operationId: unlinkRecoveryIdentity
      tags: [Auth]
      summary: Unlink Supabase recovery and rotate the current WeVid application session
      x-idempotency-policy: single-use-auth-proof
      responses:
        "200": { $ref: "#/components/responses/ApplicationSessionExpiry" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/age/sessions:
    post:
      operationId: createAgeSession
      tags: [Age]
      summary: Start third-party age assurance session
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateAgeSession"
      responses:
        "201": { $ref: "#/components/responses/AgeSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/age/status:
    get:
      operationId: getAgeStatus
      tags: [Age]
      summary: Current safe age-gate status
      responses:
        "200": { $ref: "#/components/responses/AgeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/verification/status:
    get:
      operationId: getVerificationStatus
      tags: [Verification]
      summary: Backend-owned verification capability status
      parameters:
        - in: query
          name: organizationId
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/VerificationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/verification/sessions:
    post:
      operationId: createVerificationSession
      tags: [Verification]
      summary: Start creator KYC or organization KYB provider session
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateVerificationSession"
      responses:
        "201": { $ref: "#/components/responses/VerificationSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/webhooks/verification/{provider}:
    post:
      operationId: receiveVerificationWebhook
      tags: [Verification]
      security: []
      summary: Receive signed creator KYC or organization KYB provider webhook
      parameters:
        - $ref: "#/components/parameters/VerificationProvider"
      responses:
        "202": { $ref: "#/components/responses/ProviderWebhookReceipt" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/wallets:
    get:
      operationId: listWallets
      tags: [Wallets]
      summary: Linked wallets
      responses:
        "200": { $ref: "#/components/responses/WalletList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/wallets/link-challenges:
    post:
      operationId: createWalletLinkChallenge
      tags: [Wallets]
      summary: Create a server-owned wallet-link signing challenge
      x-idempotency-policy: single-use-auth-proof
      requestBody:
        $ref: "#/components/requestBodies/CreateWalletLinkChallenge"
      responses:
        "201": { $ref: "#/components/responses/WalletLinkChallenge" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/wallets/link:
    post:
      operationId: linkWallet
      tags: [Wallets]
      summary: Link embedded or external wallet after backend challenge verification
      x-idempotency-policy: single-use-auth-proof
      requestBody:
        $ref: "#/components/requestBodies/LinkWallet"
      responses:
        "201": { $ref: "#/components/responses/Wallet" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/wallets/{walletId}/primary:
    patch:
      operationId: setPrimaryWallet
      tags: [Wallets]
      summary: Set primary wallet
      x-idempotency-policy: single-use-auth-proof
      parameters:
        - $ref: "#/components/parameters/WalletId"
      responses:
        "200": { $ref: "#/components/responses/Wallet" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/wallets/onramp-sessions:
    post:
      operationId: createOnrampSession
      tags: [Wallets]
      summary: Create provider funding session for a user-controlled wallet
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateOnrampSession"
      responses:
        "201": { $ref: "#/components/responses/OnrampSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/profiles/me:
    patch:
      operationId: updateMyProfile
      tags: [Profiles]
      summary: Update current public profile
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateProfile"
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/profiles/me/avatar:
    post:
      operationId: uploadMyProfileAvatar
      tags: [Profiles]
      summary: Upload current profile avatar through server-side Supabase Storage
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UploadProfileAvatar"
      responses:
        "201": { $ref: "#/components/responses/ProfileAvatarUpload" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/profiles/me/creator-dashboard:
    get:
      operationId: getMyCreatorDashboard
      tags: [Profiles]
      summary: Current creator monetisation dashboard
      responses:
        "200": { $ref: "#/components/responses/CreatorMonetisationDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/profiles/me/creator-onboarding:
    get:
      operationId: getMyCreatorOnboarding
      tags: [Profiles]
      summary: Backend-owned Become Creator readiness checklist
      responses:
        "200": { $ref: "#/components/responses/CreatorOnboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/profiles/{handle}:
    get:
      operationId: getProfileByHandle
      tags: [Profiles]
      summary: Public profile by handle
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200": { $ref: "#/components/responses/CreatorProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/profiles/handles/{handle}/availability:
    get:
      operationId: getProfileHandleAvailability
      tags: [Profiles]
      security: []
      summary: Check normalized handle availability; database uniqueness remains authoritative
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200": { $ref: "#/components/responses/HandleAvailability" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/content/feed:
    get:
      operationId: getContentFeed
      tags: [Content]
      summary: Mixed media Home feed
      parameters:
        - $ref: "#/components/parameters/FeedMode"
        - $ref: "#/components/parameters/FeedSurface"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/FeedPage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/follows/{userId}:
    get:
      operationId: getFollowState
      tags: [Engagement]
      summary: Read the viewer's canonical follow relationship and aggregate counts
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { $ref: "#/components/responses/FollowState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: followUser
      tags: [Engagement]
      summary: Follow a public profile without implying Mutuals, messaging, access, or membership
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/FollowState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: unfollowUser
      tags: [Engagement]
      summary: Remove a canonical follow relationship
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/FollowState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/feed/impressions:
    post:
      operationId: recordFeedImpression
      tags: [Engagement]
      summary: Record a bounded viewer-owned signal for deterministic feed de-prioritisation
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RecordFeedImpression"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/discover/search:
    get:
      operationId: searchDiscover
      tags: [Discover]
      summary: Search content, creators, hashtags, events, and live rooms
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/DiscoverPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discover/hashtags:
    get:
      operationId: listDiscoverHashtags
      tags: [Discover]
      summary: Discover active hashtags
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/HashtagPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discover/hashtags/{slug}:
    get:
      operationId: getDiscoverHashtag
      tags: [Discover]
      summary: Hashtag landing page and associated media
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/DiscoverPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discover/creators:
    get:
      operationId: listDiscoverCreators
      tags: [Discover]
      summary: Discover creator profiles
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/CreatorPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discover/events:
    get:
      operationId: listDiscoverEvents
      tags: [Discover]
      summary: Discover events
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/EventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discover/live:
    get:
      operationId: listDiscoverLive
      tags: [Discover]
      summary: Discover live rooms and replay previews
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/LiveRoomPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/feed/preferences:
    get:
      operationId: getFeedPreferences
      tags: [Feed]
      summary: Get viewer feed preferences
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      operationId: updateFeedPreferences
      tags: [Feed]
      summary: Update viewer feed preferences
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateFeedPreferences"
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
  /v1/feed/reset:
    post:
      operationId: resetFeedRecommendations
      tags: [Feed]
      summary: Reset recommendation profile
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /v1/feed/hide-creator:
    post:
      operationId: hideFeedCreator
      tags: [Feed]
      summary: Hide creator from recommendations
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/HideFeedCreator"
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
  /v1/feed/hide-topic:
    post:
      operationId: hideFeedTopic
      tags: [Feed]
      summary: Hide hashtag/topic from recommendations
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/HideFeedTopic"
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: User-owned notification projection
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/NotificationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Mark a notification read
      parameters:
        - $ref: "#/components/parameters/NotificationId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/notifications/preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      summary: Get notification preferences
      responses:
        "200": { $ref: "#/components/responses/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateNotificationPreferences
      tags: [Notifications]
      summary: Update notification preferences
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateNotificationPreferences"
      responses:
        "200": { $ref: "#/components/responses/NotificationPreferences" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/notifications/push-config:
    get:
      operationId: getNotificationPushConfig
      tags: [Notifications]
      summary: Browser-safe web push enrollment configuration
      responses:
        "200": { $ref: "#/components/responses/NotificationPushConfig" }
  /v1/notifications/devices:
    post:
      operationId: registerNotificationDevice
      tags: [Notifications]
      summary: Register a PWA push device
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RegisterNotificationDevice"
      responses:
        "201": { $ref: "#/components/responses/NotificationDevice" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/notifications/devices/{notificationDeviceId}:
    delete:
      operationId: deleteNotificationDevice
      tags: [Notifications]
      summary: Revoke a PWA push device
      parameters:
        - $ref: "#/components/parameters/NotificationDeviceId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
