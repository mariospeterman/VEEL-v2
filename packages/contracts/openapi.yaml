openapi: 3.1.0
info:
  title: Veel V2 API
  version: 0.1.0
  description: >
    Contract-first API source of truth for the Veel v2 standalone build. Fastify routes,
    generated clients, tests, and docs must stay aligned with this file.
servers:
  - url: https://api.veel.example
    description: Production
  - url: http://localhost:4000
    description: Local
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Age
  - name: Wallets
  - name: Profiles
  - name: Content
  - name: Discover
  - name: Feed
  - name: Media
  - name: Live
  - name: Engagement
  - name: Messages
  - name: Payments
  - name: Referrals
  - name: Subscriptions
  - name: Events
  - name: Tickets
  - name: Dating
  - name: Activity
  - name: AI
  - name: Admin
  - name: Webhooks
paths:
  /v1/session:
    get:
      operationId: getSession
      tags: [Auth]
      summary: Current session and protected-app gate state
      responses:
        "200": { $ref: "#/components/responses/SessionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/me:
    get:
      operationId: getMe
      tags: [Me]
      summary: Current viewer state
      responses:
        "200": { $ref: "#/components/responses/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/age/sessions:
    post:
      operationId: createAgeSession
      tags: [Age]
      summary: Start third-party age assurance session
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateAgeSession"
      responses:
        "201": { $ref: "#/components/responses/AgeSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/age/status:
    get:
      operationId: getAgeStatus
      tags: [Age]
      summary: Current safe age-gate status
      responses:
        "200": { $ref: "#/components/responses/AgeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/wallets:
    get:
      operationId: listWallets
      tags: [Wallets]
      summary: Linked wallets
      responses:
        "200": { $ref: "#/components/responses/WalletList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/wallets/link-challenges:
    post:
      operationId: createWalletLinkChallenge
      tags: [Wallets]
      summary: Create a server-owned wallet-link signing challenge
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateWalletLinkChallenge"
      responses:
        "201": { $ref: "#/components/responses/WalletLinkChallenge" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/wallets/link:
    post:
      operationId: linkWallet
      tags: [Wallets]
      summary: Link embedded or external wallet after backend challenge verification
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LinkWallet"
      responses:
        "201": { $ref: "#/components/responses/Wallet" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/wallets/{walletId}/primary:
    patch:
      operationId: setPrimaryWallet
      tags: [Wallets]
      summary: Set primary wallet
      parameters:
        - $ref: "#/components/parameters/WalletId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/Wallet" }
  /v1/wallets/onramp-sessions:
    post:
      operationId: createOnrampSession
      tags: [Wallets]
      summary: Create provider funding session for a user-controlled wallet
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateOnrampSession"
      responses:
        "201": { $ref: "#/components/responses/OnrampSession" }
  /v1/profiles/me:
    patch:
      operationId: updateMyProfile
      tags: [Profiles]
      summary: Update current public profile
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateProfile"
      responses:
        "200": { $ref: "#/components/responses/User" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/profiles/me/creator-dashboard:
    get:
      operationId: getMyCreatorDashboard
      tags: [Profiles]
      summary: Current creator monetisation dashboard
      responses:
        "200": { $ref: "#/components/responses/CreatorMonetisationDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/profiles/{handle}:
    get:
      operationId: getProfileByHandle
      tags: [Profiles]
      summary: Public profile by handle
      parameters:
        - $ref: "#/components/parameters/Handle"
      responses:
        "200": { $ref: "#/components/responses/CreatorProfile" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/follows/{userId}:
    post:
      operationId: toggleFollow
      tags: [Engagement]
      summary: Follow or unfollow a creator/profile
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/FollowState" }
  /v1/content/feed:
    get:
      operationId: getContentFeed
      tags: [Content]
      summary: Mixed media Home feed
      parameters:
        - $ref: "#/components/parameters/FeedMode"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/FeedPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/discover/search:
    get:
      operationId: searchDiscover
      tags: [Discover]
      summary: Search content, creators, hashtags, events, and live rooms
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/DiscoverPage" }
  /v1/discover/hashtags:
    get:
      operationId: listDiscoverHashtags
      tags: [Discover]
      summary: Discover active hashtags
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/HashtagPage" }
  /v1/discover/hashtags/{slug}:
    get:
      operationId: getDiscoverHashtag
      tags: [Discover]
      summary: Hashtag landing page and associated media
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/DiscoverPage" }
  /v1/discover/creators:
    get:
      operationId: listDiscoverCreators
      tags: [Discover]
      summary: Discover creator profiles
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/CreatorPage" }
  /v1/discover/events:
    get:
      operationId: listDiscoverEvents
      tags: [Discover]
      summary: Discover events
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/EventPage" }
  /v1/discover/live:
    get:
      operationId: listDiscoverLive
      tags: [Discover]
      summary: Discover live rooms and replay previews
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/LiveRoomPage" }
  /v1/feed/preferences:
    patch:
      operationId: updateFeedPreferences
      tags: [Feed]
      summary: Update viewer feed preferences
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateFeedPreferences"
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
  /v1/feed/reset:
    post:
      operationId: resetFeedRecommendations
      tags: [Feed]
      summary: Reset recommendation profile
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
  /v1/feed/hide-creator:
    post:
      operationId: hideFeedCreator
      tags: [Feed]
      summary: Hide creator from recommendations
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/HideFeedCreator"
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
  /v1/feed/hide-topic:
    post:
      operationId: hideFeedTopic
      tags: [Feed]
      summary: Hide hashtag/topic from recommendations
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/HideFeedTopic"
      responses:
        "200": { $ref: "#/components/responses/FeedPreferences" }
  /v1/content:
    post:
      operationId: createContent
      tags: [Content]
      summary: Create content draft
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateContent"
      responses:
        "201": { $ref: "#/components/responses/ContentItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/content/{contentId}:
    get:
      operationId: getContent
      tags: [Content]
      summary: Frontend-safe content detail
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200": { $ref: "#/components/responses/ContentItem" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: updateContent
      tags: [Content]
      summary: Update content metadata, visibility, thumbnail, teaser, or event draft
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateContent"
      responses:
        "200": { $ref: "#/components/responses/ContentItem" }
  /v1/media/uploads:
    post:
      operationId: createMediaUpload
      tags: [Media]
      summary: Create provider-backed upload session
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateUpload"
      responses:
        "201": { $ref: "#/components/responses/UploadSession" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/media/assets/{mediaAssetId}/sync:
    post:
      operationId: syncMediaAsset
      tags: [Media]
      summary: Sync provider media status and playback projection
      parameters:
        - $ref: "#/components/parameters/MediaAssetId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/live/rooms:
    post:
      operationId: createLiveRoom
      tags: [Live]
      summary: Create creator live room
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateLiveRoom"
      responses:
        "201": { $ref: "#/components/responses/LiveRoom" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/live/rooms/{roomId}:
    get:
      operationId: getLiveRoom
      tags: [Live]
      summary: Viewer-safe live room detail
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": { $ref: "#/components/responses/LiveRoom" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/live/rooms/{roomId}/host-connection:
    get:
      operationId: getLiveHostConnection
      tags: [Live]
      summary: Creator-only masked host connection
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": { $ref: "#/components/responses/HostConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/live/rooms/{roomId}/sync:
    post:
      operationId: syncLiveRoom
      tags: [Live]
      summary: Sync Livepeer live room status and playback projection
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/live/rooms/{roomId}/pass-intents:
    post:
      operationId: createLivePassIntent
      tags: [Live]
      summary: Create live-pass payment intent for a room
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateLivePassIntent"
      responses:
        "201": { $ref: "#/components/responses/PaymentIntent" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/live/rooms/{roomId}/messages:
    get:
      operationId: listLiveRoomMessages
      tags: [Live]
      summary: List pass-gated live chat messages
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200": { $ref: "#/components/responses/LiveChatPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createLiveRoomMessage
      tags: [Live]
      summary: Create pass-gated live chat message
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateLiveChatMessage"
      responses:
        "201": { $ref: "#/components/responses/LiveChatMessage" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/engagement/{contentId}/like:
    post:
      operationId: toggleContentLike
      tags: [Engagement]
      summary: Toggle content like
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/EngagementState" }
  /v1/engagement/{contentId}/save:
    post:
      operationId: toggleContentSave
      tags: [Engagement]
      summary: Toggle content save
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/EngagementState" }
  /v1/engagement/{contentId}/comments:
    get:
      operationId: listContentComments
      tags: [Engagement]
      summary: List content comments
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { $ref: "#/components/responses/CommentPage" }
    post:
      operationId: createContentComment
      tags: [Engagement]
      summary: Create comment
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateComment"
      responses:
        "201": { $ref: "#/components/responses/Comment" }
  /v1/shares:
    post:
      operationId: createShare
      tags: [Engagement]
      summary: Create internal share or external referral-aware share link
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateShare"
      responses:
        "201": { $ref: "#/components/responses/ShareResult" }
  /v1/reports:
    post:
      operationId: createReport
      tags: [Engagement]
      summary: Submit report for moderation
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateReport"
      responses:
        "201": { $ref: "#/components/responses/ModerationIntake" }
  /v1/blocks/{userId}:
    post:
      operationId: blockUser
      tags: [Engagement]
      summary: Block a user
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/BlockState" }
  /v1/messages/conversations:
    get:
      operationId: listConversations
      tags: [Messages]
      summary: Conversation list
      responses:
        "200": { $ref: "#/components/responses/ConversationList" }
  /v1/messages/conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [Messages]
      summary: List participant-visible conversation messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200": { $ref: "#/components/responses/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createConversationMessage
      tags: [Messages]
      summary: Send a conversation message or paid-message delivery
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateMessage"
      responses:
        "201": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/messages/conversations/{conversationId}/paid-message-intents:
    post:
      operationId: createPaidMessageIntent
      tags: [Messages]
      summary: Create paid-message intent and store backend-owned delivery draft
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreatePaidMessageIntent"
      responses:
        "201": { $ref: "#/components/responses/PaidMessageIntent" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/payments/intents:
    post:
      operationId: createPaymentIntent
      tags: [Payments]
      summary: Create or reuse backend-owned payment intent
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreatePaymentIntent"
      responses:
        "201": { $ref: "#/components/responses/PaymentIntent" }
  /v1/payments/intents/{paymentIntentId}:
    get:
      operationId: getPaymentIntent
      tags: [Payments]
      summary: Payment intent status
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200": { $ref: "#/components/responses/PaymentIntent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/payments/intents/{paymentIntentId}/transaction-request:
    get:
      operationId: getPaymentTransactionRequest
      tags: [Payments]
      summary: Server-built wallet transaction request
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200": { $ref: "#/components/responses/TransactionRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/payments/intents/{paymentIntentId}/submissions:
    post:
      operationId: submitPaymentSignature
      tags: [Payments]
      summary: Record wallet-submitted signature before confirmed evidence
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/SubmitPaymentSignature"
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/content/{contentId}/unlock-intents:
    post:
      operationId: createContentUnlockIntent
      tags: [Payments, Content]
      summary: Create or reuse a server-priced content unlock intent
      parameters:
