openapi: 3.1.0
info:
  title: Veel V2 API
  version: 0.1.0
  description: >
    Initial contract skeleton for the Veel v2 greenfield build. This file is the
    API source of truth and must be expanded slice-by-slice before implementation.
servers:
  - url: https://api.veel.example
    description: Production
  - url: http://localhost:4000
    description: Local
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Age
  - name: Wallets
  - name: Content
  - name: Media
  - name: Live
  - name: Engagement
  - name: Messages
  - name: Payments
  - name: Referrals
  - name: Subscriptions
  - name: Events
  - name: Dating
  - name: Activity
  - name: AI
  - name: Admin
  - name: Webhooks
paths:
  /v1/session:
    get:
      tags: [Auth]
      summary: Current session and protected-app gate state
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"
  /v1/me:
    get:
      tags: [Me]
      summary: Current viewer state
      responses:
        "200":
          description: Current viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
  /v1/age/sessions:
    post:
      tags: [Age]
      summary: Start third-party age assurance session
      responses:
        "201":
          description: Age assurance session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeSession"
  /v1/age/status:
    get:
      tags: [Age]
      summary: Current safe age-gate status
      responses:
        "200":
          description: Age state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgeStatus"
  /v1/wallets:
    get:
      tags: [Wallets]
      summary: Linked wallets
      responses:
        "200":
          description: Wallets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"
  /v1/wallets/link:
    post:
      tags: [Wallets]
      summary: Link embedded or external wallet after backend challenge verification
      responses:
        "201":
          description: Wallet linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /v1/wallets/{walletId}/primary:
    patch:
      tags: [Wallets]
      summary: Set primary wallet
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /v1/wallets/onramp-sessions:
    post:
      tags: [Wallets]
      summary: Create provider funding session for a user-controlled wallet
      responses:
        "201":
          description: Onramp session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnrampSession"
  /v1/profiles/me:
    patch:
      tags: [Me]
      summary: Update current public profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v1/profiles/{handle}:
    get:
      tags: [Me]
      summary: Public profile by handle
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /v1/content/feed:
    get:
      tags: [Content]
      summary: Mixed media Home feed
      parameters:
        - $ref: "#/components/parameters/FeedMode"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"
  /v1/content/{contentId}:
    get:
      tags: [Content]
      summary: Frontend-safe content detail
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Content detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
    patch:
      tags: [Content]
      summary: Update content metadata, visibility, thumbnail, teaser, or event draft
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
      responses:
        "200":
          description: Content detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
  /v1/content:
    post:
      tags: [Content]
      summary: Create content draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentRequest"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
  /v1/media/uploads:
    post:
      tags: [Media]
      summary: Create provider-backed upload session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Safe upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
  /v1/live/rooms/{roomId}:
    get:
      tags: [Live]
      summary: Viewer-safe live room detail
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Live room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveRoom"
  /v1/live/rooms/{roomId}/host-connection:
    get:
      tags: [Live]
      summary: Creator-only masked host connection
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Masked host connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostConnection"
  /v1/engagement/{contentId}/like:
    post:
      tags: [Engagement]
      summary: Toggle content like
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Engagement state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementState"
  /v1/engagement/{contentId}/save:
    post:
      tags: [Engagement]
      summary: Toggle content save
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Engagement state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementState"
  /v1/engagement/{contentId}/comments:
    get:
      tags: [Engagement]
      summary: List content comments
      parameters:
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
    post:
      tags: [Engagement]
      summary: Create comment
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
  /v1/shares:
    post:
      tags: [Engagement]
      summary: Create internal share or external referral-aware share link
      responses:
        "201":
          description: Share result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResult"
  /v1/follows/{userId}:
    post:
      tags: [Engagement]
      summary: Follow or unfollow a creator/profile
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Follow state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
  /v1/reports:
    post:
      tags: [Engagement]
      summary: Submit report for moderation
      responses:
        "201":
          description: Report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationIntake"
  /v1/blocks/{userId}:
    post:
      tags: [Engagement]
      summary: Block a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Block state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockState"
  /v1/messages/conversations:
    get:
      tags: [Messages]
      summary: Conversation list
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
  /v1/payments/intents:
    post:
      tags: [Payments]
      summary: Create or reuse backend-owned payment intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentIntentRequest"
      responses:
        "201":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
  /v1/payments/intents/{paymentIntentId}/transaction-request:
    get:
      tags: [Payments]
      summary: Server-built wallet transaction request
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200":
          description: Transaction request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionRequest"
  /v1/payments/intents/{paymentIntentId}:
    get:
      tags: [Payments]
      summary: Payment intent status
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "200":
          description: Payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
  /v1/payments/intents/{paymentIntentId}/submissions:
    post:
      tags: [Payments]
      summary: Record wallet-submitted signature before confirmed evidence
      parameters:
        - $ref: "#/components/parameters/PaymentIntentId"
      responses:
        "202":
          description: Submission accepted
  /v1/referrals/tokens:
    post:
      tags: [Referrals]
      summary: Create external referral or content-share token
      responses:
        "201":
          description: Referral token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralToken"
  /v1/subscriptions/plans:
    get:
      tags: [Subscriptions]
      summary: Platform and creator subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlanPage"
  /v1/events/{eventId}/tickets/intents:
    post:
      tags: [Events]
      summary: Create ticket payment or approval intent
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "201":
          description: Ticket intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketIntent"
  /v1/dating/swipes:
    post:
      tags: [Dating]
      summary: Record explicit Dating Mode swipe/action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatingSwipeRequest"
      responses:
        "200":
          description: Dating action result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatingSwipeResult"
  /v1/activity:
    get:
      tags: [Activity]
      summary: Backend-derived user activity
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
  /v1/ai/sessions:
    post:
      tags: [AI]
      summary: Start a permission-scoped AI session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAiSessionRequest"
      responses:
        "201":
          description: AI session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSession"
  /v1/admin/ops/summary:
    get:
      tags: [Admin]
      summary: Admin operations summary
      responses:
        "200":
          description: Admin ops summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOpsSummary"
  /v1/webhooks/solana-indexer:
    post:
      tags: [Webhooks]
      summary: Confirmed Solana payment evidence webhook
      security: []
      responses:
        "202":
          description: Accepted
  /v1/webhooks/media/{provider}:
    post:
      tags: [Webhooks]
      summary: Media provider webhook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [bunny, livepeer]
      responses:
        "202":
          description: Accepted
  /v1/webhooks/age/{provider}:
    post:
      tags: [Webhooks]
      summary: Age/KYC provider webhook
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [yoti, sumsub, persona]
      responses:
        "202":
          description: Accepted
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    FeedMode:
      name: mode
      in: query
      schema:
        type: string
        enum: [recommended, following, nsfw, sfw, live, premium]
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentIntentId:
      name: paymentIntentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SessionState:
      type: object
      required: [authenticated, appAccessState]
      properties:
        authenticated:
          type: boolean
        appAccessState:
          $ref: "#/components/schemas/AppAccessState"
        user:
          $ref: "#/components/schemas/User"
    AgeSession:
      type: object
      required: [id, provider, launchUrl, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        launchUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    AgeStatus:
      type: object
      required: [state]
      properties:
        state:
          $ref: "#/components/schemas/AgeState"
        provider:
          type: string
          nullable: true
    Wallet:
      type: object
      required: [id, chain, address, provider, isPrimary]
      properties:
        id:
          type: string
          format: uuid
        chain:
          type: string
        address:
          type: string
        provider:
          type: string
          enum: [embedded, phantom, solflare, wallet_adapter]
        isPrimary:
          type: boolean
    OnrampSession:
      type: object
      required: [provider, launchUrl, walletAddress]
      properties:
        provider:
          type: string
        launchUrl:
          type: string
          format: uri
        walletAddress:
          type: string
    Me:
      type: object
      required: [user, ageState, walletState, appAccessState, feedPreferences]
      properties:
        user:
          $ref: "#/components/schemas/User"
        ageState:
          $ref: "#/components/schemas/AgeState"
        walletState:
          $ref: "#/components/schemas/WalletState"
        appAccessState:
          $ref: "#/components/schemas/AppAccessState"
        feedPreferences:
          $ref: "#/components/schemas/FeedPreferences"
    User:
      type: object
      required: [id, handle, displayName, badges]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        badges:
          type: array
          items:
            $ref: "#/components/schemas/UserBadge"
    AgeState:
      type: string
      enum: [not_required, required, pending, verified, failed]
    AppAccessState:
      type: object
      required: [allowed, reason]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: [ready, age_required, age_pending, wallet_required, blocked]
    UserBadge:
      type: object
      required: [key, label, group]
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
          enum: [trust, creator, community, subscription]
    FeedPreferences:
      type: object
      required: [defaultMode, nsfwPreference]
      properties:
        defaultMode:
          type: string
          enum: [recommended, following, nsfw, sfw]
        nsfwPreference:
          type: string
          enum: [recommended, nsfw, sfw]
    WalletState:
      type: object
      required: [connected, chain]
      properties:
        connected:
          type: boolean
        chain:
          type: string
          enum: [solana_devnet, solana_mainnet]
        address:
          type: string
          nullable: true
    FeedPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentItem"
        nextCursor:
          type: string
          nullable: true
    ContentItem:
      type: object
      required: [id, creator, mediaType, accessState, engagement]
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: "#/components/schemas/User"
        mediaType:
          type: string
          enum: [bit, clip, image, vod, live_replay]
        caption:
          type: string
          nullable: true
        posterUrl:
          type: string
          format: uri
          nullable: true
        playback:
          $ref: "#/components/schemas/PlaybackResource"
        accessState:
          type: string
          enum: [free, teaser, locked, unlocked, subscribed, pass_required]
        nsfwLabel:
          type: string
          enum: [none, adult, explicit, sensitive]
        engagement:
          $ref: "#/components/schemas/EngagementState"
    PlaybackResource:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [not_ready, teaser, full, blocked]
        url:
          type: string
          format: uri
          nullable: true
        provider:
          type: string
          enum: [bunny, livepeer, none]
    CreateContentRequest:
      type: object
      required: [mediaType, visibility, nsfwLabel]
      properties:
        mediaType:
          type: string
          enum: [bit, clip, image, vod, live_replay]
        caption:
          type: string
        visibility:
          type: string
          enum: [public, followers, subscribers, private]
        nsfwLabel:
          type: string
          enum: [none, adult, explicit, sensitive]
        eventDraft:
          $ref: "#/components/schemas/EventDraft"
    UpdateContentRequest:
      type: object
      properties:
        caption:
          type: string
        visibility:
          type: string
          enum: [public, followers, subscribers, private]
        nsfwLabel:
          type: string
          enum: [none, adult, explicit, sensitive]
        teaserStartMs:
          type: integer
          nullable: true
        teaserEndMs:
          type: integer
          nullable: true
        thumbnailFrameMs:
          type: integer
          nullable: true
        eventDraft:
          $ref: "#/components/schemas/EventDraft"
    EventDraft:
      type: object
      required: [title, startsAt, accessRule, location]
      properties:
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        ticketCapacity:
          type: integer
          minimum: 1
        ticketPriceMinor:
          type: integer
          nullable: true
        accessRule:
          type: string
          enum: [public_sale, private_apply]
        location:
          $ref: "#/components/schemas/EventLocationDraft"
    EventLocationDraft:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [digital_live_stream, physical]
        label:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        provider:
          type: string
          enum: [openstreetmap, manual, none]
        providerPlaceId:
          type: string
    CreateUploadRequest:
      type: object
      required: [contentId, fileName, mimeType]
      properties:
        contentId:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
    UploadSession:
      type: object
      required: [uploadUrl, provider, expiresAt]
      properties:
        uploadUrl:
          type: string
          format: uri
        provider:
          type: string
          enum: [bunny]
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    LiveRoom:
      type: object
      required: [id, creator, state, accessState, passOptions]
      properties:
        id:
          type: string
          format: uuid
        creator:
          $ref: "#/components/schemas/User"
        state:
          type: string
          enum: [scheduled, waiting, live, ended, replay_ready]
        accessState:
          type: string
          enum: [free, locked, pass_required, pass_active]
        playback:
          $ref: "#/components/schemas/PlaybackResource"
        teaserSecondsRemaining:
          type: integer
          nullable: true
        passOptions:
          type: array
          items:
            $ref: "#/components/schemas/LivePassOption"
    LivePassOption:
      type: object
      required: [durationMinutes, amountMinor, currency]
      properties:
        durationMinutes:
          type: integer
          enum: [30, 60, 180]
        amountMinor:
          type: integer
        currency:
          type: string
          enum: [SOL, USDC]
    HostConnection:
      type: object
      required: [maskedIngestUrl, streamKeyHint]
      properties:
        maskedIngestUrl:
          type: string
        streamKeyHint:
          type: string
    EngagementState:
      type: object
      required: [liked, saved, likeCount, commentCount, shareCount]
      properties:
        liked:
          type: boolean
        saved:
          type: boolean
        likeCount:
          type: integer
        commentCount:
          type: integer
        shareCount:
          type: integer
    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type: string
          nullable: true
    Comment:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: "#/components/schemas/User"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    ShareResult:
      type: object
      required: [id, mode]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [internal_message, external_referral_link, copy_link]
        url:
          type: string
          format: uri
          nullable: true
    FollowState:
      type: object
      required: [following, followerCount]
      properties:
        following:
          type: boolean
        followerCount:
          type: integer
    ModerationIntake:
      type: object
      required: [id, state]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [submitted, queued]
    BlockState:
      type: object
      required: [blocked]
      properties:
        blocked:
          type: boolean
    Conversation:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [direct, match, paid]
        title:
          type: string
    CreatePaymentIntentRequest:
      type: object
      required: [productType, targetId]
      properties:
        productType:
          type: string
          enum: [tip, support, unlock, paid_message, live_pass, event_ticket, creator_subscription, platform_subscription]
        targetId:
          type: string
          format: uuid
        amountMinor:
          type: integer
          nullable: true
        livePassDurationMinutes:
          type: integer
          enum: [30, 60, 180]
          nullable: true
    PaymentIntent:
      type: object
      required: [id, productType, amountMinor, currency, state]
      properties:
        id:
          type: string
          format: uuid
        productType:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
          enum: [SOL, USDC]
        state:
          type: string
          enum: [pending, transaction_requested, confirmed, failed, expired]
    ReferralToken:
      type: object
      required: [token, url, eligibility]
      properties:
        token:
          type: string
        url:
          type: string
          format: uri
        eligibility:
          type: string
          enum: [external_share, partner_campaign, not_commissionable]
    SubscriptionPlanPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlan"
    SubscriptionPlan:
      type: object
      required: [id, scope, label, amountMinor, currency]
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [platform, creator]
        label:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
          enum: [SOL, USDC]
    TransactionRequest:
      type: object
      required: [transactionRequestUrl, expiresAt]
      properties:
        transactionRequestUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    TicketIntent:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [free_granted, approval_required, payment_required]
        paymentIntent:
          $ref: "#/components/schemas/PaymentIntent"
    DatingSwipeRequest:
      type: object
      required: [targetUserId, contentId, action]
      properties:
        targetUserId:
          type: string
          format: uuid
        contentId:
          type: string
          format: uuid
        action:
          type: string
          enum: [yes, not_interested]
    DatingSwipeResult:
      type: object
      required: [matchCreated]
      properties:
        matchCreated:
          type: boolean
        matchId:
          type: string
          format: uuid
          nullable: true
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        nextCursor:
          type: string
          nullable: true
    ActivityItem:
      type: object
      required: [id, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateAiSessionRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [user_self_service, creator_helper, admin_ops]
    AiSession:
      type: object
      required: [id, scope, allowedTools]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
        allowedTools:
          type: array
          items:
            type: string
    AdminOpsSummary:
      type: object
      required: [providerHealth, paymentHealth, moderationQueue]
      properties:
        providerHealth:
          type: string
          enum: [healthy, degraded, incident]
        paymentHealth:
          type: string
          enum: [healthy, lagging, incident]
        moderationQueue:
          type: integer
