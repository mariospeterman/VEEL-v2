  schemas:
    HealthStatus:
      type: object
      required: [service, status, environment, version, commit, timestamp, checks]
      properties:
        service: { type: string }
        status: { type: string, enum: [ok, degraded, unavailable] }
        environment: { type: string }
        version: { type: string }
        commit: { type: string }
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, degraded, unavailable, not_configured] }
              message: { type: string }
    ErrorCode:
      type: string
      enum: [unauthorized, forbidden, not_found, validation_failed, rate_limited, conflict, idempotency_conflict, provider_unavailable, service_unavailable, recent_authentication_required, payment_not_confirmed, webhook_signature_invalid]
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    ProductType:
      type: string
      enum: [tip, support, content_unlock, paid_message, live_pass, event_access_pass, creator_subscription, platform_subscription]
    Currency:
      type: string
      enum: [SOL, USDC]
    SessionState:
      type: object
      required: [authenticated, appAccessState]
      properties:
        authenticated: { type: boolean }
        appAccessState: { $ref: "#/components/schemas/AppAccessState" }
        user: { $ref: "#/components/schemas/User" }
    CreateAgeSessionRequest:
      type: object
      additionalProperties: false
      required: [providerPreference]
      properties:
        providerPreference: { type: string, enum: [reusable_first, didit, yoti, sumsub, veriff, persona] }
    AgeSession:
      type: object
      required: [id, provider, launchUrl, expiresAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        launchUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    AgeStatus:
      type: object
      required: [state]
      properties:
        state: { $ref: "#/components/schemas/AgeState" }
        provider: { type: string, nullable: true }
    CreateVerificationSessionRequest:
      type: object
      required: [purpose]
      properties:
        purpose: { type: string, enum: [adult_publisher_eligibility, creator_kyc, org_kyb] }
        providerPreference: { type: string, enum: [provider_first, sumsub, didit, persona, veriff], default: provider_first }
        organizationId: { type: string, format: uuid, nullable: true }
        source: { type: string, enum: [create, earnings, organization], default: create }
        adultPublisherTermsAccepted: { type: boolean, default: false }
    VerificationSession:
      type: object
      required: [id, provider, providerReference, launchUrl, expiresAt, purpose]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [sumsub, didit, persona, veriff] }
        providerReference: { type: string }
        launchUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        purpose: { type: string, enum: [adult_publisher_eligibility, performer_eligibility, creator_kyc, org_kyb] }
    ProviderWebhookReceipt:
      type: object
      required: [provider, received, processed]
      properties:
        provider: { type: string }
        received: { type: integer, minimum: 0 }
        processed: { type: integer, minimum: 0 }
    VerificationRecordSummary:
      type: object
      required: [subjectType, subjectId, purpose, status, provider, method, assuranceLevel, verifiedAt, expiresAt, reusable]
      properties:
        subjectType: { type: string, enum: [user, organization, organization_person, performer] }
        subjectId: { type: string, format: uuid }
        purpose: { type: string, enum: [age_access, adult_publisher_eligibility, performer_eligibility, creator_kyc, payout_kyc, org_kyb, ubo_kyc, enterprise_review] }
        status: { type: string, enum: [valid, invalid, pending, expired, revoked, blocked] }
        provider: { type: string }
        method: { type: string }
        assuranceLevel: { type: string }
        verifiedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        reusable: { type: boolean }
    VerificationStatus:
      type: object
      required: [capabilities, missingRequirements, nextBestAction, verificationSummary]
      properties:
        capabilities:
          type: object
          additionalProperties: { type: boolean }
        missingRequirements:
          type: array
          items: { type: string }
        nextBestAction: { type: string }
        verificationSummary:
          type: object
          required: [ageAccess, adultPublisherEligibility, creatorKyc, orgKyb]
          properties:
            ageAccess: { oneOf: [{ $ref: "#/components/schemas/VerificationRecordSummary" }, { type: "null" }] }
            adultPublisherEligibility: { oneOf: [{ $ref: "#/components/schemas/VerificationRecordSummary" }, { type: "null" }] }
            creatorKyc: { oneOf: [{ $ref: "#/components/schemas/VerificationRecordSummary" }, { type: "null" }] }
            orgKyb: { oneOf: [{ $ref: "#/components/schemas/VerificationRecordSummary" }, { type: "null" }] }
    Wallet:
      type: object
      required: [id, chain, address, provider, isPrimary]
      properties:
        id: { type: string, format: uuid }
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        address: { type: string }
        provider: { type: string, enum: [embedded_privy, phantom, solflare, wallet_adapter] }
        isPrimary: { type: boolean }
    WalletProvider:
      type: string
      enum: [embedded_privy, phantom, solflare, wallet_adapter]
    ExternalWalletProvider:
      type: string
      enum: [phantom, solflare, wallet_adapter]
    CreateWalletAuthChallengeRequest:
      type: object
      additionalProperties: false
      required: [chain, address, provider]
      properties:
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        address: { type: string, minLength: 32, maxLength: 64 }
        provider: { $ref: "#/components/schemas/WalletProvider" }
    WalletAuthChallenge:
      type: object
      required: [id, chain, address, provider, message, expiresAt]
      properties:
        id: { type: string, format: uuid }
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        address: { type: string }
        provider: { $ref: "#/components/schemas/WalletProvider" }
        message: { type: string }
        expiresAt: { type: string, format: date-time }
    WalletAuthProof:
      type: object
      additionalProperties: false
      required: [challengeId, message, signature, signatureEncoding]
      properties:
        challengeId: { type: string, format: uuid }
        message: { type: string }
        signature: { type: string }
        signatureEncoding: { type: string, enum: [base58, base64] }
    CreateWalletAuthSessionRequest:
      type: object
      additionalProperties: false
      required: [provider, address, chain, proof]
      properties:
        provider: { $ref: "#/components/schemas/WalletProvider" }
        address: { type: string }
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        proof: { $ref: "#/components/schemas/WalletAuthProof" }
    WalletAuthSession:
      type: object
      required: [expiresAt, wallet]
      properties:
        expiresAt: { type: string, format: date-time }
        wallet: { $ref: "#/components/schemas/Wallet" }
    ApplicationSessionExpiry:
      type: object
      required: [expiresAt]
      properties:
        expiresAt: { type: string, format: date-time }
    HandleAvailability:
      type: object
      required: [handle, available]
      properties:
        handle: { type: string, pattern: "^[a-z0-9_]{2,32}$" }
        available: { type: boolean }
    CreateWalletLinkChallengeRequest:
      type: object
      additionalProperties: false
      required: [chain, address, provider]
      properties:
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        address: { type: string, minLength: 32, maxLength: 64 }
        provider: { $ref: "#/components/schemas/ExternalWalletProvider" }
    WalletLinkChallenge:
      type: object
      required: [id, chain, address, provider, message, expiresAt]
      properties:
        id: { type: string, format: uuid }
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        address: { type: string }
        provider: { $ref: "#/components/schemas/ExternalWalletProvider" }
        message: { type: string }
        expiresAt: { type: string, format: date-time }
    WalletLinkProof:
      type: object
      additionalProperties: false
      required: [challengeId, message, signature, signatureEncoding]
      properties:
        challengeId: { type: string, format: uuid }
        message: { type: string }
        signature: { type: string }
        signatureEncoding: { type: string, enum: [base58, base64] }
    LinkWalletRequest:
      type: object
      additionalProperties: false
      required: [provider, address, chain, proof]
      properties:
        provider: { $ref: "#/components/schemas/ExternalWalletProvider" }
        address: { type: string }
        chain: { type: string, enum: [solana_devnet, solana_mainnet] }
        proof: { $ref: "#/components/schemas/WalletLinkProof" }
    CreateOnrampSessionRequest:
      type: object
      required: [walletId]
      properties:
        walletId: { type: string, format: uuid }
        returnUrl: { type: string, format: uri }
    OnrampSession:
      type: object
      required: [id, provider, launchUrl, walletId, walletAddress, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        launchUrl: { type: string, format: uri }
        walletId: { type: string, format: uuid }
        walletAddress: { type: string }
        state: { type: string, enum: [created, completed, failed, expired, canceled] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
    User:
      type: object
      required: [id, handle, displayName, badges]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string, format: uri, nullable: true }
        badges: { type: array, items: { $ref: "#/components/schemas/UserBadge" } }
    CreatorProfile:
      type: object
      required: [user, stats, monetisation, recentContent]
      properties:
        user: { $ref: "#/components/schemas/User" }
        bio: { type: string, nullable: true }
        locationLabel: { type: string, nullable: true }
        links:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ProfileLink" }
        stats: { $ref: "#/components/schemas/CreatorProfileStats" }
        monetisation: { $ref: "#/components/schemas/PublicCreatorMonetisation" }
        recentContent: { type: array, items: { $ref: "#/components/schemas/ContentItem" } }
    CreatorProfileStats:
      type: object
      required: [contentCount, liveRoomCount, confirmedPaymentCount, followerCount, followingCount]
      properties:
        contentCount: { type: integer }
        liveRoomCount: { type: integer }
        confirmedPaymentCount: { type: integer }
        followerCount: { type: integer }
        followingCount: { type: integer }
    PublicCreatorMonetisation:
      type: object
      required: [supportEnabled, contentUnlocksEnabled, livePassesEnabled, paidMessagesEnabled, subscriptionsEnabled]
      properties:
        supportEnabled: { type: boolean }
        contentUnlocksEnabled: { type: boolean }
        livePassesEnabled: { type: boolean }
        paidMessagesEnabled: { type: boolean }
        subscriptionsEnabled: { type: boolean }
    CreatorMonetisationDashboard:
      type: object
      required: [creator, readiness, earnings, products, recentActivity]
      properties:
        creator: { $ref: "#/components/schemas/User" }
        readiness: { $ref: "#/components/schemas/CreatorMonetisationReadiness" }
        earnings: { $ref: "#/components/schemas/CreatorEarningsSummary" }
        products: { type: array, items: { $ref: "#/components/schemas/CreatorProductSummary" } }
        recentActivity: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } }
    CreatorMonetisationReadiness:
      type: object
      required: [state, earningState, kycState, taxProfileState, recipientWalletState, readinessScore, canMonetize, policyBoundary, blockedReasons]
      properties:
        state: { type: string, enum: [active, paused, blocked] }
        earningState: { type: string, enum: [not_configured, ready, review_required, held] }
        kycState: { type: string, enum: [not_required, required, pending, verified, failed] }
        taxProfileState: { type: string, enum: [not_required, required, pending, verified] }
        recipientWalletState: { type: string, enum: [missing, linked] }
        readinessScore: { type: integer, minimum: 0, maximum: 100 }
        canMonetize: { type: boolean }
        nextAction: { type: string, nullable: true }
        policyBoundary: { type: string, enum: [creator_records_only_no_balances_payout_queue_or_social_priority] }
        blockedReasons: { type: array, items: { type: string } }
    CreatorOnboarding:
      type: object
      required: [state, canStartEarning, readinessScore, policyBoundary, steps]
      properties:
        state: { type: string, enum: [ready, action_required, review_required, blocked] }
        canStartEarning: { type: boolean }
        readinessScore: { type: integer, minimum: 0, maximum: 100 }
        nextAction: { type: string, nullable: true }
        policyBoundary: { type: string, enum: [creator_records_only_no_balances_payout_queue_or_social_priority] }
        steps: { type: array, items: { $ref: "#/components/schemas/CreatorOnboardingStep" } }
    CreatorOnboardingStep:
      type: object
      required: [key, label, state, required]
      properties:
        key:
          type: string
          enum: [profile, age, wallet, kyc, tax_profile, recipient_wallet, products]
        label: { type: string }
        state: { type: string, enum: [complete, action_required, review_required, blocked, not_required] }
        required: { type: boolean }
        actionHref: { type: string, nullable: true }
    CreatorEarningsSummary:
      type: object
      required: [currency, creatorEarningsMinor, platformFeesMinor, referralCommissionsMinor, confirmedPaymentCount]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        creatorEarningsMinor: { type: integer }
        platformFeesMinor: { type: integer }
        referralCommissionsMinor: { type: integer }
        confirmedPaymentCount: { type: integer }
    CreatorProductSummary:
      type: object
      required: [productType, enabled, confirmedPaymentCount, amountMinor, currency]
      properties:
        productType: { $ref: "#/components/schemas/ProductType" }
        enabled: { type: boolean }
        confirmedPaymentCount: { type: integer }
        amountMinor: { type: integer }
        currency: { $ref: "#/components/schemas/Currency" }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [handle]
      properties:
        handle: { type: string, pattern: "^[a-z0-9_]{2,32}$" }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        avatarUrl: { type: string, format: uri, nullable: true, maxLength: 2048 }
        bio: { type: string, maxLength: 500 }
        locationLabel: { type: string, maxLength: 120 }
        links:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/ProfileLink" }
    ProfileLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 32 }
        url: { type: string, format: uri, maxLength: 2048 }
