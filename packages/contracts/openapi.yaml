        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    appSessionCookie:
      type: apiKey
      in: cookie
      name: wevid_session
    recoveryBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 12, maxLength: 128 }
      description: Required for replay-safe money, entitlement, Event Access, message, social, Mutuals, age, verification, moderation, and admin mutations.
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 12, maxLength: 128 }
      description: Optional idempotency key for non-critical replay-safe requests.
    WebhookSignature:
      name: X-Veel-Webhook-Signature
      in: header
      required: true
      schema: { type: string }
      description: Provider-specific signature or shared-secret header normalized by the adapter.
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    SearchQuery:
      name: q
      in: query
      schema: { type: string, minLength: 1, maxLength: 120 }
    FeedMode:
      name: mode
      in: query
      schema:
        type: string
        enum: [recommended, following, nsfw, sfw]
    FeedSurface:
      name: surface
      in: query
      schema:
        type: string
        enum: [home, bits]
    ContentId: { name: contentId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaAssetId: { name: mediaAssetId, in: path, required: true, schema: { type: string, format: uuid } }
    RoomId: { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
