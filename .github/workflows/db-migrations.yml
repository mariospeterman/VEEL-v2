name: db-migrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-plan:
    name: migration-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Print tool versions
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check Supabase CLI
        run: pnpm supabase:version
      - name: Check database migrations
        run: pnpm database:check
      - name: Run database tests
        run: pnpm --filter @veel/database test
