name: release-artifacts

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-prefix
        name: Resolve lowercase image prefix
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}
            RELEASE_VERSION=main-${{ github.event.workflow_run.run_number }}
          tags: ${{ steps.image-prefix.outputs.value }}/web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}
            RELEASE_VERSION=main-${{ github.event.workflow_run.run_number }}
          tags: ${{ steps.image-prefix.outputs.value }}/api:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          build-args: |
            RELEASE_SOURCE_SHA=${{ github.event.workflow_run.head_sha }}
            RELEASE_VERSION=main-${{ github.event.workflow_run.run_number }}
          tags: ${{ steps.image-prefix.outputs.value }}/worker:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest web image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image-prefix.outputs.value }}/web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
      - name: Attest API image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image-prefix.outputs.value }}/api
          subject-digest: ${{ steps.api.outputs.digest }}
          push-to-registry: true
      - name: Attest worker image
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image-prefix.outputs.value }}/worker
          subject-digest: ${{ steps.worker.outputs.digest }}
          push-to-registry: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Generate immutable manifest
        env:
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_WEB_IMAGE: ${{ steps.image-prefix.outputs.value }}/web
          RELEASE_WEB_DIGEST: ${{ steps.web.outputs.digest }}
          RELEASE_API_IMAGE: ${{ steps.image-prefix.outputs.value }}/api
          RELEASE_API_DIGEST: ${{ steps.api.outputs.digest }}
          RELEASE_WORKER_IMAGE: ${{ steps.image-prefix.outputs.value }}/worker
          RELEASE_WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: node scripts/generate-release-manifest.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.event.workflow_run.head_sha }}
          path: release/release-manifest.json
          if-no-files-found: error
          retention-days: 30
