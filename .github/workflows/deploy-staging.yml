name: staging-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-preflight:
    name: staging-preflight
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Print tool versions
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build application artifact
        run: pnpm build
      - name: Check database migrations
        run: pnpm database:check
      - name: Verify staging release preflight
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          API_READY_URL: ${{ vars.API_READY_URL }}
        run: pnpm deploy:check
