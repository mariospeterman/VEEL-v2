name: preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Print tool versions
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build deployable apps
        run: pnpm build
      - name: Verify deploy skeleton
        run: pnpm deploy:check
