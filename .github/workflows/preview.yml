name: preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build deployable apps
        run: pnpm build
      - name: Verify deploy skeleton
        run: pnpm deploy:check
