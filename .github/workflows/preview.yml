name: preview-preflight

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview-preflight:
    name: preview-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false
      - name: Print tool versions
        run: |
          node --version
          pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build OCI runtime targets
        run: |
          docker build --target web --tag wevid-web:preview .
          docker build --target api --tag wevid-api:preview .
          docker build --target worker --tag wevid-worker:preview .
          test "$(docker image inspect wevid-web:preview --format '{{.Config.User}}')" = node
          test "$(docker image inspect wevid-api:preview --format '{{.Config.User}}')" = node
          test "$(docker image inspect wevid-worker:preview --format '{{.Config.User}}')" = node
      - name: Verify release preflight skeleton
        run: pnpm deploy:check
