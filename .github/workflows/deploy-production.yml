name: production-promotion

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful release-artifacts workflow run ID already proven in staging
        required: true
      expected_manifest_digest:
        description: Exact sha256 manifest digest approved after staging
        required: true
      production_approval:
        description: Type PROMOTE_EXACT_STAGING_ARTIFACT
        required: true

permissions:
  contents: read
  actions: read
  packages: read
  attestations: read
  id-token: write

jobs:
  production-promotion:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Require explicit promotion acknowledgement
        if: inputs.production_approval != 'PROMOTE_EXACT_STAGING_ARTIFACT'
        run: exit 1
      - name: Download exact release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'release-manifest-*' --dir "$RUNNER_TEMP/release-download"
      - name: Resolve exact approved source
        shell: bash
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: |
          manifest="$(find "$RUNNER_TEMP/release-download" -name release-manifest.json -type f -print -quit)"
          test -n "$manifest"
          actual="$(node -p 'require(process.argv[1]).manifestDigest' "$manifest")"
          test "$actual" = "$EXPECTED_MANIFEST_DIGEST"
          echo "RELEASE_MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"
          echo "RELEASE_SOURCE_SHA=$(node -p 'require(process.argv[1]).sourceSha' "$manifest")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify manifest against its exact source
        env:
          RELEASE_VERIFY_SOURCE: "true"
          RELEASE_EXPECTED_SHA: ${{ env.RELEASE_SOURCE_SHA }}
        run: node scripts/verify-release-manifest.mjs "$RELEASE_MANIFEST_PATH"
      - name: Production safety preflight
        env:
          DEPLOY_ENV: production
          DEPLOY_ENABLED: "false"
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          PAYMENT_DEFAULT_ASSET: ${{ vars.PAYMENT_DEFAULT_ASSET }}
          PAYMENT_USDC_MINT: ${{ vars.PAYMENT_USDC_MINT }}
          PAYMENT_PLATFORM_FEE_WALLET: ${{ vars.PAYMENT_PLATFORM_FEE_WALLET }}
          PAYMENT_PLATFORM_TREASURY_WALLET: ${{ vars.PAYMENT_PLATFORM_TREASURY_WALLET }}
          HELIUS_WEBHOOK_SECRET: ${{ secrets.HELIUS_WEBHOOK_SECRET }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_STREAM_LIBRARY_ID: ${{ vars.BUNNY_STREAM_LIBRARY_ID }}
          BUNNY_STREAM_EMBED_TOKEN_KEY: ${{ secrets.BUNNY_STREAM_EMBED_TOKEN_KEY }}
          BUNNY_STREAM_WEBHOOK_READONLY_KEY: ${{ secrets.BUNNY_STREAM_WEBHOOK_READONLY_KEY }}
          LIVEPEER_API_KEY: ${{ secrets.LIVEPEER_API_KEY }}
          LIVEPEER_WEBHOOK_SECRET: ${{ secrets.LIVEPEER_WEBHOOK_SECRET }}
          LIVEPEER_ACCESS_CONTROL_PRIVATE_KEY: ${{ secrets.LIVEPEER_ACCESS_CONTROL_PRIVATE_KEY }}
          LIVEPEER_ACCESS_CONTROL_PUBLIC_KEY: ${{ vars.LIVEPEER_ACCESS_CONTROL_PUBLIC_KEY }}
          LIVEPEER_WEBHOOK_ID: ${{ vars.LIVEPEER_WEBHOOK_ID }}
          LIVEPEER_MODERATION_MULTISTREAM_TARGET_ID: ${{ vars.LIVEPEER_MODERATION_MULTISTREAM_TARGET_ID }}
          NOTIFICATION_DEVICE_ENCRYPTION_KEY: ${{ secrets.NOTIFICATION_DEVICE_ENCRYPTION_KEY }}
          AGE_VERIFICATION_DRIVER: ${{ vars.AGE_VERIFICATION_DRIVER }}
          AGE_VERIFICATION_ALLOW_MOCK_PROVIDER: "false"
          API_RATE_LIMIT_STORE_DRIVER: ${{ vars.API_RATE_LIMIT_STORE_DRIVER }}
          API_RATE_LIMIT_REDIS_URL: ${{ secrets.API_RATE_LIMIT_REDIS_URL }}
          API_TRUST_PROXY: ${{ vars.API_TRUST_PROXY }}
          LIVEPEER_ADULT_LIVE_ENABLED: "false"
          MEDIA_MODERATION_MODE: ${{ vars.MEDIA_MODERATION_MODE }}
          SUBSCRIPTIONS_ENABLED: ${{ vars.SUBSCRIPTIONS_ENABLED }}
          SUBSCRIPTIONS_PROVIDER: ${{ vars.SUBSCRIPTIONS_PROVIDER }}
          SUBSCRIPTIONS_REQUIRE_ONCHAIN_VERIFICATION: ${{ vars.SUBSCRIPTIONS_REQUIRE_ONCHAIN_VERIFICATION }}
          SUBSCRIPTIONS_SOLANA_PROGRAM_ID: ${{ vars.SUBSCRIPTIONS_SOLANA_PROGRAM_ID }}
          SUBSCRIPTIONS_SOLANA_RPC_URL: ${{ vars.SUBSCRIPTIONS_SOLANA_RPC_URL }}
          SUBSCRIPTIONS_SUPPORTED_MINTS: ${{ vars.SUBSCRIPTIONS_SUPPORTED_MINTS }}
          SUBSCRIPTIONS_DEFAULT_MINT: ${{ vars.SUBSCRIPTIONS_DEFAULT_MINT }}
          SUBSCRIPTIONS_COLLECTOR_WALLET: ${{ vars.SUBSCRIPTIONS_COLLECTOR_WALLET }}
          SUBSCRIPTIONS_COLLECTOR_PRIVATE_KEY: ${{ secrets.SUBSCRIPTIONS_COLLECTOR_PRIVATE_KEY }}
          SUBSCRIPTIONS_MERCHANT_WALLET: ${{ vars.SUBSCRIPTIONS_MERCHANT_WALLET }}
          SUBSCRIPTIONS_STAGING_AUTHORIZATION_SIGNATURE: ${{ vars.SUBSCRIPTIONS_STAGING_AUTHORIZATION_SIGNATURE }}
          SUBSCRIPTIONS_STAGING_COLLECTION_SIGNATURE: ${{ vars.SUBSCRIPTIONS_STAGING_COLLECTION_SIGNATURE }}
          TRANSACTIONAL_EMAIL_PROVIDER: ${{ vars.TRANSACTIONAL_EMAIL_PROVIDER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ONRAMP_PROVIDER: ${{ vars.ONRAMP_PROVIDER }}
          COINBASE_CDP_API_KEY_ID: ${{ secrets.COINBASE_CDP_API_KEY_ID }}
          COINBASE_CDP_API_KEY_SECRET: ${{ secrets.COINBASE_CDP_API_KEY_SECRET }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          STAGING_EVIDENCE_BUNDLE_JSON: ${{ secrets.STAGING_EVIDENCE_BUNDLE_JSON }}
          LEGAL_DOCUMENTS_APPROVED: ${{ vars.LEGAL_DOCUMENTS_APPROVED }}
          LEGAL_TERMS_VERSION: ${{ vars.LEGAL_TERMS_VERSION }}
          LEGAL_PRIVACY_VERSION: ${{ vars.LEGAL_PRIVACY_VERSION }}
          LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
          EXPECTED_MANIFEST_DIGEST: ${{ inputs.expected_manifest_digest }}
        run: node scripts/check-deploy-readiness.mjs
      - name: Deployment-provider gate
        run: |
          echo 'Production promotion remains blocked until the launch-approved hosting adapter/OIDC and matching staging evidence are configured.' >&2
          exit 1
