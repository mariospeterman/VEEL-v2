name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-toolchain-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Print tool versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check docs, route map, OpenAPI, and schema alignment
        run: node scripts/check-docs.mjs

      - name: Check database migrations
        run: node packages/database/scripts/check-migrations.mjs

      - name: Verify deploy readiness skeleton
        run: node scripts/check-deploy-readiness.mjs

      - name: Generate contract types
        run: pnpm contracts:generate

      - name: Verify generated contract types are committed
        run: git diff --exit-code packages/contracts/src/generated/openapi.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke
        run: pnpm smoke

      - name: Whitespace check
        run: git diff --check
