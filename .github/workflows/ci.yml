name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-toolchain-proof:
    name: pinned-toolchain-proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Print tool versions
        run: |
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check docs, route map, OpenAPI, and schema alignment
        run: node scripts/check-docs.mjs

      - name: Check database migrations
        run: node packages/database/scripts/check-migrations.mjs

      - name: Verify deploy readiness skeleton
        run: node scripts/check-deploy-readiness.mjs

      - name: Generate contract types
        run: pnpm contracts:generate

      - name: Verify generated contract types are committed
        run: git diff --exit-code packages/contracts/src/generated/openapi.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke
        run: pnpm smoke

      - name: Whitespace check
        run: git diff --check

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start isolated Supabase database
        run: pnpm exec supabase start --exclude studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor --yes

      - name: Run authenticated API integration suite
        shell: bash
        run: |
          eval "$(pnpm exec supabase status -o env)"
          VEEL_ENABLE_REAL_API_INTEGRATION_TESTS=1 API_INTEGRATION_DATABASE_URL="$DB_URL" pnpm exec vitest run apps/api/test/authenticated-happy-path.integration.test.ts

      - name: Stop isolated Supabase database
        if: always()
        run: pnpm exec supabase stop --no-backup
