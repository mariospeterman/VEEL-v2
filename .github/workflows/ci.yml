name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check docs, route map, OpenAPI, and schema alignment
        run: pnpm docs:check

      - name: Generate contract types
        run: pnpm contracts:generate

      - name: Verify generated contract types are committed
        run: git diff --exit-code packages/contracts/src/generated/openapi.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke
        run: pnpm smoke

      - name: Whitespace check
        run: git diff --check
